[project]
name = "surrogate-xapps"
version = "0.1.0"
description = "Surrogate CCO (throughput-max) and ES (power-min) xApps over QACM/cmsORAN CSV datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
surrogate-xapps = "surrogate_xapps.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surrogate_xapps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
